name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk high-age-cognitive-practice-realme-c71-v1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: 高齡認知練習-realme-C71-APK
          path: high-age-cognitive-practice-realme-c71-v1.apk
          retention-days: 30
