<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>高齡認知練習</title><style>*{box-sizing:border-box}body{margin:0;background:#eef7ee;font-family:sans-serif;font-weight:900;color:#17351f}.app{max-width:680px;margin:auto;padding:12px}.head{display:flex;gap:12px;align-items:center;background:#fff;border:3px solid #83ba91;border-radius:22px;padding:10px;margin-bottom:14px}.logo{width:68px;height:68px;border-radius:16px;background:#8cc79a;display:grid;place-items:center;color:#fff;font-size:38px}.head h1{font-size:34px;line-height:1.1;margin:0;color:#186b4e}.card{background:#fff;border:3px solid #b9cfbd;border-radius:22px;padding:16px;margin-bottom:14px}h2{font-size:34px;color:#a20f22;line-height:1.25;margin:0 0 14px}p,label{font-size:29px;line-height:1.45}.btn{width:100%;min-height:70px;margin:7px 0;border:0;border-radius:18px;background:#32774d;color:#fff;font-size:32px;font-weight:900;box-shadow:0 5px #17502e}.btn.alt{background:#7d1540;box-shadow:0 5px #520b28}.row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin:12px 0}.row input,.recall{width:100%;height:66px;border:4px solid #84998a;border-radius:10px;font-size:34px;font-weight:900;padding:6px}.hide{display:none}.feedback{font-size:30px;padding:12px;border-radius:14px;margin:12px 0}.ok{background:#dff3e3}.no{background:#ffe2e2;color:#8a1111}.memory{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{border:3px solid #879b8c;background:#fff;text-align:center;padding:8px}.item b{font-size:27px;color:#25678b;display:block}.item span{font-size:62px}.timer{text-align:center;font-size:76px;color:#a20f22}.clock{font-size:58px;text-align:center;color:#a20f22}canvas{width:100%;aspect-ratio:1;background:#fff;border:4px solid #68786b;border-radius:15px;touch-action:none}</style></head><body><main class="app"><header class="head"><div class="logo">33</div><h1>高齡駕駛人<br>認知練習</h1></header><section id="home"><div class="card"><h2>今天在哪裡練習？</h2><button class="btn loc" data-v="家裡">家裡</button><button class="btn loc" data-v="大潤發百貨">大潤發百貨</button><button class="btn loc" data-v="監理站">監理站</button></div></section><section id="quiz" class="hide"><div class="card"><h2 id="title"></h2><div id="body"></div><div id="fb"></div><button id="check" class="btn alt">看答案</button><button id="next" class="btn hide">下一題</button></div></section><section id="memory" class="hide"><div class="card"><h2>第二關：短期記憶</h2><p>請仔細記住下面十樣東西。</p><div id="items" class="memory"></div></div><button id="seen" class="btn">我看完了</button></section><section id="wait" class="hide"><div class="card"><h2>請休息兩分鐘</h2><p>請不要返回查看。</p><div id="timer" class="timer">02:00</div></div></section><section id="recall" class="hide"><div class="card"><h2>請寫出記得的物品</h2><div id="inputs"></div><div id="mfb"></div><button id="mcheck" class="btn alt">看結果</button></div></section><section id="clock" class="hide"><div class="card"><h2>第三關：畫時鐘</h2><p>請畫出指定時間：</p><div id="time" class="clock"></div><canvas id="cv" width="700" height="700"></canvas><button id="clear" class="btn">清除重畫</button><button id="answer" class="btn alt">看參考答案</button><button id="finish" class="btn">完成練習</button></div></section><section id="done" class="hide"><div class="card"><h2>練習完成</h2><button id="again" class="btn">再練習一次</button></div></section></main><script>const $=s=>document.querySelector(s),screens=['home','quiz','memory','wait','recall','clock','done'];function show(id){screens.forEach(x=>$('#'+x).classList.toggle('hide',x!==id));scrollTo(0,0)}let place='',qi=0,th,tm;const z=['猴','雞','狗','豬','鼠','牛','虎','兔','龍','蛇','馬','羊'];function info(){let d=new Date();let lm='',ld='';try{let p=new Intl.DateTimeFormat('zh-TW-u-ca-chinese',{month:'long',day:'numeric'}).formatToParts(d);lm=(p.find(x=>x.type==='month')||{}).value||'';ld=(p.find(x=>x.type==='day')||{}).value||''}catch(e){}return{y:d.getFullYear(),r:d.getFullYear()-1911,z:z[d.getFullYear()%12],m:d.getMonth()+1,day:d.getDate(),w:['日','一','二','三','四','五','六'][d.getDay()],lm:lm.replace('月',''),ld}}const qs=[{t:'問題一：今年是民國幾年，或今年出生的小孩屬什麼生肖',h:'<div class="row"><label>民國</label><input id="a1" inputmode="numeric"><span>年</span></div><div class="row"><label>生肖</label><input id="a2"><span></span></div><div class="row"><label>西元</label><input id="a3" inputmode="numeric"><span>年</span></div>',a:()=>{let d=info();return`民國 ${d.r} 年／生肖 ${d.z}／西元 ${d.y} 年`},c:()=>{let d=info();return $('#a1').value.trim()==d.r||$('#a2').value.includes(d.z)||$('#a3').value.trim()==d.y}},{t:'問題二：這個月是國曆或農曆幾月',h:'<div class="row"><label>國曆</label><input id="a1" inputmode="numeric"><span>月</span></div><div class="row"><label>農曆</label><input id="a2"><span>月</span></div>',a:()=>{let d=info();return`國曆 ${d.m} 月／農曆 ${d.lm||'請依手機日期確認'} 月`},c:()=>{let d=info();return $('#a1').value.trim()==d.m||(d.lm&&$('#a2').value.includes(d.lm))}},{t:'問題三：今天是國曆或農曆幾號',h:'<div class="row"><label>國曆</label><input id="a1" inputmode="numeric"><span>號</span></div><div class="row"><label>農曆</label><input id="a2"><span>日</span></div>',a:()=>{let d=info();return`國曆 ${d.day} 號／農曆 ${d.ld||'請依手機日期確認'} 日`},c:()=>{let d=info();return $('#a1').value.trim()==d.day||(d.ld&&$('#a2').value.includes(d.ld))}},{t:'問題四：今天星期幾',h:'<div class="row"><label>星期</label><input id="a1"><span></span></div>',a:()=>`星期${info().w}`,c:()=>['星期'+info().w,info().w,info().w==='日'?'天':''].includes($('#a1').value.trim())},{t:'問題五：這裡是什麼地方',h:'<div class="row"><label>答案</label><input id="a1"><span></span></div>',a:()=>place,c:()=>{let v=$('#a1').value.trim();return place==='家裡'?['家裡','家中','家'].includes(v):place==='大潤發百貨'?['大潤發百貨','大潤發'].includes(v):['監理站','監理所'].includes(v)}}];function render(){let q=qs[qi];$('#title').textContent=q.t;$('#body').innerHTML=q.h;$('#fb').innerHTML='';$('#check').classList.remove('hide');$('#next').classList.add('hide');$('#next').textContent=qi===4?'繼續第二關':'下一題';show('quiz')}document.querySelectorAll('.loc').forEach(b=>b.onclick=()=>{place=b.dataset.v;qi=0;render()});$('#check').onclick=()=>{let q=qs[qi],ok=q.c();$('#fb').className='feedback '+(ok?'ok':'no');$('#fb').innerHTML=(ok?'答對了！<br>':'再看看答案：<br>')+q.a();$('#check').classList.add('hide');$('#next').classList.remove('hide')};$('#next').onclick=()=>{if(qi<4){qi++;render()}else startMemory()};const objs=[['紅綠燈','🚦'],['禁止停車','🚫'],['機車','🛵'],['救護車','🚑'],['菜刀','🔪'],['碗','🥣'],['芭樂','🍈'],['蘋果','🍎'],['傘','☂️'],['筆','🖊️']];function startMemory(){$('#items').innerHTML=objs.map(x=>`<div class="item"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');show('memory')}$('#seen').onclick=()=>{show('wait');let n=120;let id=setInterval(()=>{n--;$('#timer').textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');if(n<=0){clearInterval(id);startRecall()}},1000)};function startRecall(){$('#inputs').innerHTML=Array.from({length:10},(_,i)=>`<input class="recall" placeholder="第 ${i+1} 樣">`).join('');show('recall')}$('#mcheck').onclick=()=>{let aliases={'摩托車':'機車','雨傘':'傘','原子筆':'筆','飯碗':'碗','番石榴':'芭樂','刀':'菜刀','交通號誌':'紅綠燈'};let vals=[...document.querySelectorAll('.recall')].map(x=>aliases[x.value.trim()]||x.value.trim());let names=objs.map(x=>x[0]),good=[...new Set(vals.filter(x=>names.includes(x)))];$('#mfb').className='feedback '+(good.length>=4?'ok':'no');$('#mfb').textContent=`答對 ${good.length} 樣，${good.length>=4?'通過！':'需要四樣以上。'}`;$('#mcheck').textContent='繼續畫時鐘';$('#mcheck').onclick=startClock};function face(hands){let c=$('#cv'),x=c.getContext('2d'),cx=350,cy=350,r=300;x.clearRect(0,0,700,700);x.fillStyle='#fff';x.fillRect(0,0,700,700);x.strokeStyle='#222';x.lineWidth=8;x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.stroke();x.font='bold 58px sans-serif';x.textAlign='center';x.textBaseline='middle';for(let n=1;n<=12;n++){let a=n*Math.PI/6-Math.PI/2;x.fillStyle='#111';x.fillText(n,cx+Math.cos(a)*240,cy+Math.sin(a)*240)}if(hands){let ma=tm*Math.PI/30-Math.PI/2,ha=(th%12+tm/60)*Math.PI/6-Math.PI/2;x.strokeStyle='#174f2d';x.lineCap='round';x.lineWidth=18;x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+Math.cos(ha)*145,cy+Math.sin(ha)*145);x.stroke();x.lineWidth=12;x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+Math.cos(ma)*210,cy+Math.sin(ma)*210);x.stroke()}}function startClock(){th=Math.floor(Math.random()*12)+1;tm=[0,5,10,15,20,25,30,35,40,45,50,55][Math.floor(Math.random()*12)];$('#time').textContent=`${th} 點 ${String(tm).padStart(2,'0')} 分`;face(false);show('clock')}let cv=$('#cv'),ctx=cv.getContext('2d'),drawing=false,last;function pt(e){let r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*700/r.width,y:(e.clientY-r.top)*700/r.height}}cv.onpointerdown=e=>{drawing=true;last=pt(e)};cv.onpointermove=e=>{if(!drawing)return;let p=pt(e);ctx.strokeStyle='#c21b2e';ctx.lineWidth=13;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p};onpointerup=()=>drawing=false;$('#clear').onclick=()=>face(false);$('#answer').onclick=()=>face(true);$('#finish').onclick=()=>show('done');$('#again').onclick=()=>show('home');</script></body></html>
